<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">
<meta name="author" content="Fernando Garcia Rangel">
<title>Apps — Fernando Garcia Rangel</title>
<meta name="description" content="Ferramentas de Fernando Garcia Rangel: WeightChartS (acompanhamento de peso) e Calculadora TMB.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f97316'/><path d='M6 22 13 14 18 19 26 8' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<!-- Antes do CSS: evita o flash de tema errado ao recarregar. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('appshub_theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === 'light' ? '#fafafa' : '#09090b';
      }
    } catch (e) { /* localStorage indisponível — segue no tema escuro */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="page">
    <div class="page-bar">
      <button type="button" class="theme-toggle" id="btnTheme" aria-pressed="false" title="Alternar tema claro ou escuro">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20.5 13.5A8 8 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 3v2.2M12 18.8V21M4.2 12H2M22 12h-2.2M6.3 6.3 4.8 4.8M19.2 19.2l-1.5-1.5M17.7 6.3l1.5-1.5M4.8 19.2l1.5-1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <header class="intro">
      <p class="eyebrow">Fernando Garcia Rangel</p>
      <h1>Ferramentas</h1>
      <p class="lede">Escolha uma para abrir.</p>
    </header>

    <nav class="menu" aria-label="Aplicativos disponíveis">
      <a class="entry" href="https://weight-charts.vercel.app/" target="_blank" rel="noopener noreferrer">
        <span class="entry-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M4 22 L11 14 L16 19 L28 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="28" cy="6" r="2.5" fill="currentColor"/>
          </svg>
        </span>
        <span class="entry-body">
          <span class="entry-title">WeightChartS</span>
          <span class="entry-desc">Acompanhamento de peso com gráfico de evolução e conta na nuvem.</span>
        </span>
        <span class="entry-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 17 17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>

      <a class="entry" href="https://calculadora-tmb-five.vercel.app/" target="_blank" rel="noopener noreferrer">
        <span class="entry-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 5c-4 5-8 8-8 14a8 8 0 0 0 16 0c0-3-1.5-5-3-6.5.3 2-.5 3.5-2 4-1-2.5.5-5-3-8.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="entry-body">
          <span class="entry-title">Calculadora TMB</span>
          <span class="entry-desc">Taxa metabólica basal (Mifflin–St Jeor) e gasto diário estimado.</span>
        </span>
        <span class="entry-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 17 17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
    </nav>

    <footer class="site-footer">
      <a href="https://github.com/fernandogarciarangel" target="_blank" rel="noopener noreferrer">github.com/fernandogarciarangel</a>
    </footer>
  </main>

  <script>
    (function () {
      var STORAGE_KEY = 'appshub_theme';
      var btn = document.getElementById('btnTheme');
      if (!btn) return;

      function currentTheme() {
        return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
      }

      function applyTheme(theme) {
        var t = theme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = t === 'light' ? '#fafafa' : '#09090b';

        btn.setAttribute('aria-pressed', t === 'light' ? 'true' : 'false');
        btn.title = t === 'light' ? 'Mudar para o tema escuro' : 'Mudar para o tema claro';
        btn.setAttribute('aria-label', btn.title);
      }

      applyTheme(currentTheme());

      btn.addEventListener('click', function () {
        var next = currentTheme() === 'light' ? 'dark' : 'light';
        applyTheme(next);
        try {
          localStorage.setItem(STORAGE_KEY, next);
        } catch (e) { /* ignore */ }
      });
    })();
  </script>
</body>
</html>
